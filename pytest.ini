# Pytest Configuration for Telar
#
# This file configures pytest for running the Telar test suite. Tests are
# organized into unit tests (fast, isolated), integration tests (may touch
# the file system), and E2E tests (require live Jekyll server).
#
# Run all tests with `pytest` or with coverage using `pytest --cov=scripts`.
# For visual regression: `pytest tests/e2e/test_visual_regression.py`
# To update baselines: `pytest tests/e2e/test_visual_regression.py --update-snapshots`
#
# Version: v1.8.0

[pytest]

# `tests` is the everyday suite. `audit` joins it because two things rotted
# there unseen while it was measured only when named: a test that could not
# import for six days after the function it covered was replaced, and a
# complexity anchor that was stale the day it was written.
#
# The whole of `audit`, harness included, which makes a full run about a
# minute rather than eight seconds. An earlier version of this line excluded
# `audit/harness` through `addopts`, and `addopts` is not scoped to the
# default run: it applies to `pytest audit/` as well, which is what
# `debt-gate.yml` runs, and it silently took that job from 995 tests to 93.
# For a tight loop, name the directory: `pytest tests/unit`.
testpaths = tests audit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts = -v --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require file system)
    e2e: End-to-end tests (require live Jekyll server)
    visual: Visual regression tests (screenshot comparison)
    slow: Slow tests (skip with -m "not slow")
